<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-contact">
    <main class="conteneur-formulaire">
        <nav class="tete-form">
            <h1 class="titreform">FORMULAIRE</h1>
         <a href="index.html" class="lien-acteuil">revenir a l'acceuil</a>
        </nav>
        

        <form class="formulaire" action="#" method="get"><br>
        <label for="nom">Votre nom</label><br>
        <input type="text" id="nom" name="nom"><br>

        <label for="prenom">Votre prenom</label><br>
        <input type="text" id="prenom" name="prenom"><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required><br>

        <label for="password">mot de passe</label><br>
        <input type="password" id="password" name="password" required><br>

        <label for="tel">telephone</label><br>
        <input type="number" id="tel" name="tel" min="0"><br>

        <label>choisissez votre age:</label><br>
        <input type="radio" name="age" id="age1"><label class="age1" for="age1">moins de 25ans</label><br>
        <input type="radio" name="age" id="age2"><label class="age2" for="age2">plus de 25ans </label><br>

        <input type="checkbox"  id="contact"><label for="contact"> j'accepte d'etre contacter</label><br>

        <label for="message">laissez un message</label><br>
        <textarea id="message" name="message"></textarea><br>

        <label for="niveau">selectionnez votre niveau d'etude </label><br>
        <select id="niveau" name="niveau">
            <option value="L1">licence1</option>
            <option value="L2">licence2</option>
            <option value="L3">licence3</option> 
        </select><br>
        <button type="submit">envoyer</button>

     </form>
     
    </main>
     
</body>
</html>
